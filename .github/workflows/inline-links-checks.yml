name: Inline links checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Astro
        run: npm run check
      - name: Verify safe inline link parsing
        run: npm run test:inline-links
      - name: Build site
        run: npm run build
      - name: Verify inline link rendering and draft exclusion
        run: npm run test:inline-links:build
      - name: Verify existing indexing and security policy
        run: node scripts/audit-build.mjs
