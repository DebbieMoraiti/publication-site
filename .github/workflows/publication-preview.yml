name: Publication preview

# Automatic live preview for the independent publication.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publication-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_PATH: /
      PUBLIC_SITE_URL: https://storyfields.gr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Astro
        run: npm run check

      - name: Verify contact configuration and email fallback
        run: node scripts/audit-contact.mjs

      - name: Build preview
        run: npm run build

      - name: Verify generated security policy
        run: |
          test -f dist/_headers
          grep -q "Content-Security-Policy:" dist/_headers
          grep -q "X-Robots-Tag: noindex" dist/_headers

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v5

  audit:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Audit deployed SEO and social metadata
        env:
          AUDIT_SITE_URL: https://storyfields.gr
        run: node scripts/audit-deployed.mjs

      - name: Audit homepage
        run: >
          npx --yes lighthouse@13.5.0
          https://storyfields.gr/
          --chrome-flags="--headless --no-sandbox"
          --only-categories=performance,accessibility,best-practices,seo
          --output=json
          --output-path=./lighthouse-home.json

      - name: Verify responsive layouts and images
        env:
          AUDIT_SITE_URL: https://storyfields.gr
        run: node scripts/audit-responsive.mjs

      - name: Audit article
        run: >
          npx --yes lighthouse@13.5.0
          https://storyfields.gr/articles/after-40-you-dont-start-from-zero/
          --chrome-flags="--headless --no-sandbox"
          --only-categories=performance,accessibility,best-practices,seo
          --output=json
          --output-path=./lighthouse-article.json

      - name: Audit Contact in English
        run: >
          npx --yes lighthouse@13.5.0
          https://storyfields.gr/contact/
          --chrome-flags="--headless --no-sandbox"
          --only-categories=performance,accessibility,best-practices,seo
          --output=json
          --output-path=./lighthouse-contact-en.json

      - name: Audit Contact in Greek
        run: >
          npx --yes lighthouse@13.5.0
          https://storyfields.gr/el/contact/
          --chrome-flags="--headless --no-sandbox"
          --only-categories=performance,accessibility,best-practices,seo
          --output=json
          --output-path=./lighthouse-contact-el.json

      - name: Audit The Prisoners article
        run: >
          npx --yes lighthouse@13.5.0
          https://storyfields.gr/articles/the-prisoners-eightball-sold-out-2026/
          --chrome-flags="--headless --no-sandbox"
          --only-categories=performance,accessibility,best-practices,seo
          --output=json
          --output-path=./lighthouse-prisoners.json

      - name: Check Lighthouse thresholds
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['lighthouse-home.json', 'lighthouse-article.json', 'lighthouse-contact-en.json', 'lighthouse-contact-el.json', 'lighthouse-prisoners.json'];
          let failed = false;
          for (const file of files) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const scores = Object.fromEntries(
              Object.entries(report.categories).map(([key, value]) => [key, value.score ?? 0]),
            );
            console.log(file, scores);
            if (scores.performance < 0.85) failed = true;
            if (scores.accessibility < 0.95) failed = true;
            if (scores['best-practices'] < 0.95) failed = true;
          }
          if (failed) {
            throw new Error('Lighthouse quality threshold failed.');
          }
          NODE

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-*.json

      - name: Upload responsive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-reports
          path: responsive-reports/
