name: Publication validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/tags.test.mjs scripts/topic-visibility.test.mjs scripts/contact-ajax.test.mjs
      - run: npm run build
      - run: npm run astro -- check
      - run: node scripts/audit-build.mjs
      - run: node scripts/audit-tags.mjs
      - run: node scripts/audit-contact.mjs
      - run: node scripts/audit-contact-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-ui-preview
          path: responsive-reports/
