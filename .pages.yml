# Pages CMS configuration for the independent publication.
# Editorial content and media are editable here; technical settings remain code-reviewed.

media:
  input: public/uploads
  output: /uploads
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif]

settings:
  hide: true

components:
  shortCopy:
    type: object
    fields:
      - name: en
        label: English
        type: string
      - name: el
        label: Ελληνικά
        type: string

  titleCopy:
    type: object
    required: true
    fields:
      - name: en
        label: English
        type: string
        required: true
      - name: el
        label: Ελληνικά
        type: string
        required: true

  longCopy:
    type: object
    fields:
      - name: en
        label: English
        type: text
      - name: el
        label: Ελληνικά
        type: text

  paragraphCopy:
    type: object
    fields:
      - name: en
        label: English paragraphs
        type: text
        list: true
      - name: el
        label: Ελληνικές παράγραφοι
        type: text
        list: true

content:
  - name: publication
    label: Publication / Ταυτότητα
    type: file
    path: src/content/publication.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: identity
        label: Identity / Ταυτότητα
        type: object
        fields:
          - name: name
            label: Working publication name / Προσωρινό όνομα
            type: string
            required: true
          - name: tagline
            label: Tagline
            component: longCopy
      - name: intro
        label: Homepage introduction / Εισαγωγή αρχικής
        component: longCopy

  - name: articles
    label: Articles / Άρθρα
    type: collection
    path: src/content/articles
    format: json
    filename:
      template: "{slug}.json"
      field: false
    view:
      primary: slug
      fields: [slug, status, date, type, author, topicSlug]
      sort: [date, status, type]
      search: [slug, title.en, title.el, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: Lowercase Latin letters, digits and hyphens. Keep stable after publication.
      - name: type
        label: Format / Τύπος
        type: select
        required: true
        options:
          values:
            - { name: feature, label: Feature }
            - { name: profile, label: Profile }
            - { name: essay, label: Essay }
            - { name: interview, label: Interview }
            - { name: review, label: Review }
            - { name: update, label: Short update }
      - name: status
        label: Status / Κατάσταση
        type: select
        required: true
        default: draft
        options:
          values:
            - { name: draft, label: Draft / Προσχέδιο }
            - { name: published, label: Published / Δημοσιευμένο }
      - name: featured
        label: Featured on homepage / Κεντρικό στην αρχική
        type: boolean
        default: false
        description: Keep only one story featured at a time.
      - name: date
        label: Publication date / Ημερομηνία
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: author
        label: Author / Συντάκτης
        type: reference
        required: true
        options:
          collection: authors
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: topicSlug
        label: Topic / Θεματική
        type: reference
        required: true
        options:
          collection: topics
          search: "label.en,label.el,slug"
          value: "{fields.slug}"
          label: "{fields.label.en}"
      - name: tags
        label: Tags / Ετικέτες
        type: string
        list: true
        description: Lowercase reusable tags, e.g. music, everyday-life, web.
      - name: title
        label: Title / Τίτλος
        component: titleCopy
      - name: dek
        label: Summary / Υπότιτλος
        component: longCopy
      - name: topic
        label: Display topic label / Εμφανιζόμενο θέμα
        component: shortCopy
        description: Optional editorial label; the topic collection controls taxonomy.
      - name: image
        label: Hero image / Κεντρική εικόνα
        type: image
      - name: imageAlt
        label: Image description / Περιγραφή εικόνας
        component: shortCopy
      - name: body
        label: Article body / Κείμενο άρθρου
        component: paragraphCopy

  - name: authors
    label: Authors / Συντάκτες
    type: collection
    path: src/content/authors
    format: json
    filename:
      template: "{slug}.json"
      field: false
    view:
      primary: name
      fields: [name, slug]
      sort: [name]
      search: [name, slug]
    fields:
      - name: slug
        label: Author slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: name
        label: Public name / Δημόσιο όνομα
        type: string
        required: true
      - name: role
        label: Role / Ρόλος
        component: shortCopy
      - name: bio
        label: Bio
        component: longCopy
      - name: links
        label: Public links / Δημόσιοι σύνδεσμοι
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: HTTPS URL
            type: string

  - name: topics
    label: Topics / Θεματικές
    type: collection
    path: src/content/topics
    format: json
    filename:
      template: "{slug}.json"
      field: false
    view:
      primary: slug
      fields: [slug, label.en, label.el]
      sort: [slug]
      search: [slug, label.en, label.el]
    fields:
      - name: slug
        label: Topic slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: label
        label: Label / Ονομασία
        component: titleCopy
