# Pages CMS reads this file per repository and branch. The editor touches only
# content JSON files. Technical site, theme and module settings stay separate.
media:
  input: public/uploads
  output: /uploads
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif]

settings:
  hide: true

components:
  shortCopy:
    type: object
    fields:
      - name: en
        label: English
        type: string
      - name: el
        label: Ελληνικά
        type: string
  titleCopy:
    type: object
    required: true
    fields:
      - name: en
        label: English
        type: string
        required: true
      - name: el
        label: Ελληνικά
        type: string
        required: true
  longCopy:
    type: object
    fields:
      - name: en
        label: English
        type: text
      - name: el
        label: Ελληνικά
        type: text
  card:
    type: object
    fields:
      - name: title
        label: Title / Τίτλος
        component: titleCopy
      - name: subtitle
        label: Subtitle / Υπότιτλος
        component: shortCopy
      - name: description
        label: Description / Περιγραφή
        component: longCopy
      - name: image
        label: Image / Εικόνα
        type: image
      - name: imagePositionX
        label: Horizontal focus (%) / Οριζόντια θέση (%)
        type: number
        options: { min: 0, max: 100 }
        description: 0 = left, 50 = center, 100 = right. Use the image preview to choose.
      - name: imagePositionY
        label: Vertical focus (%) / Κάθετη θέση (%)
        type: number
        options: { min: 0, max: 100 }
        description: 0 = top, 50 = center, 100 = bottom.
      - name: imageZoom
        label: Zoom / Μεγέθυνση
        type: number
        options: { min: 1, max: 2 }
        description: 1 = original crop; up to 2 = twice as close.
      - name: imageAlt
        label: Image description / Περιγραφή εικόνας
        component: shortCopy
      - name: url
        label: Link / Σύνδεσμος
        type: string
        description: HTTPS URL or a path starting with /; leave blank for no link.

content:
  - name: artist
    label: Artist & social links / Καλλιτέχνης και σύνδεσμοι
    type: file
    path: src/content/artist.json
    format: json
    operations:
      create: false
      delete: false
    fields:
      - name: identity
        label: Artist identity / Ταυτότητα καλλιτέχνη
        type: object
        fields:
          - name: name
            label: Artist name / Όνομα καλλιτέχνη
            type: string
            required: true
          - name: eyebrow
            label: Above the name / Πάνω από το όνομα
            component: shortCopy
          - name: tagline
            label: Hero introduction / Κείμενο αρχικής
            component: longCopy
      - name: contact
        label: Contact / Επικοινωνία
        type: object
        fields:
          - name: email
            label: Public professional email / Δημόσιο επαγγελματικό email
            type: string
            description: Use only a public booking/business address. Never add a private personal email. Publication is also controlled by site.json privacy settings.
      - name: socials
        label: Social profiles / Κοινωνικά προφίλ
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{platform}'
        fields:
          - name: platform
            label: Platform / Πλατφόρμα
            type: string
            required: true
          - name: url
            label: Profile URL / Σύνδεσμος προφίλ
            type: string
            description: Use only the artist's confirmed public HTTPS profile; leave blank to hide it.
          - name: verifiedPublic
            label: Verified public identity for Schema.org / Επιβεβαιωμένη δημόσια ταυτότητα για Schema.org
            type: boolean
            default: false
            description: Enable only after confirming this is an official public profile controlled by or unambiguously belonging to the artist.

  - name: about
    label: About / Σχετικά
    type: file
    path: src/content/about.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: intro
        label: Introduction / Εισαγωγή
        component: longCopy
      - name: paragraphs
        label: Biography / Βιογραφικό
        type: object
        fields:
          - name: en
            label: English paragraphs
            type: text
            list: true
          - name: el
            label: Ελληνικές παράγραφοι
            type: text
            list: true
      - name: image
        label: Portrait / Φωτογραφία
        type: image
      - name: imagePositionX
        label: Horizontal focus (%) / Οριζόντια θέση (%)
        type: number
        options: { min: 0, max: 100 }
      - name: imagePositionY
        label: Vertical focus (%) / Κάθετη θέση (%)
        type: number
        options: { min: 0, max: 100 }
      - name: imageZoom
        label: Zoom / Μεγέθυνση
        type: number
        options: { min: 1, max: 2 }
      - name: imageAlt
        label: Image description / Περιγραφή εικόνας
        component: shortCopy

  - name: projects
    label: Projects / Σχήματα
    type: file
    path: src/content/projects.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: intro
        label: Introduction / Εισαγωγή
        component: longCopy
      - name: items
        label: Projects / Σχήματα
        component: card
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title.en}'

  - name: discography
    label: Discography / Δισκογραφία
    type: file
    path: src/content/discography.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: intro
        label: Introduction / Εισαγωγή
        component: longCopy
      - name: items
        label: Releases / Κυκλοφορίες
        component: card
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title.en}'

  - name: media
    label: Media / Πολυμέσα
    type: file
    path: src/content/media.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: intro
        label: Introduction / Εισαγωγή
        component: longCopy
      - name: items
        label: Videos and links / Βίντεο και σύνδεσμοι
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title.en}'
        fields:
          - name: title
            label: Title / Τίτλος
            component: titleCopy
          - name: embedUrl
            label: Embed URL / Σύνδεσμος ενσωμάτωσης
            type: string
            description: Use only an official/public YouTube /embed/VIDEO_ID or Vimeo player.vimeo.com/video/ID URL. Third-party embeds are disabled by default in site.json privacy settings.
          - name: url
            label: External link / Εξωτερικός σύνδεσμος
            type: string
            description: HTTPS URL; leave blank if the embedded video is enough.

  - name: live
    label: Live dates / Εμφανίσεις
    type: file
    path: src/content/live.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: intro
        label: Introduction / Εισαγωγή
        component: longCopy
      - name: emptyUpcoming
        label: No upcoming dates / Χωρίς επόμενες εμφανίσεις
        component: shortCopy
      - name: emptyPast
        label: No archive dates / Χωρίς παλαιότερες εμφανίσεις
        component: shortCopy
      - name: items
        label: Events / Εκδηλώσεις
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{date} — {fields.title.en}'
        fields:
          - name: id
            label: Unique ID / Μοναδικός κωδικός
            type: string
            required: true
            pattern: '^[a-z0-9-]+$'
            description: Lowercase Latin letters, digits and hyphens; never repeat an ID.
          - name: date
            label: Date / Ημερομηνία
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: title
            label: Event title / Τίτλος εμφάνισης
            component: titleCopy
          - name: venue
            label: Venue / Χώρος
            type: string
          - name: city
            label: City / Πόλη
            type: string
          - name: poster
            label: Poster / Αφίσα
            type: image
          - name: posterAlt
            label: Poster description / Περιγραφή αφίσας
            component: shortCopy
          - name: ticketUrl
            label: Ticket links / Σύνδεσμοι εισιτηρίων
            component: shortCopy
            description: Use HTTPS URLs. Each language may have its own link.

  - name: services
    label: Teaching & services / Διδασκαλία και υπηρεσίες
    type: file
    path: src/content/services.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: intro
        label: Introduction / Εισαγωγή
        component: longCopy
      - name: items
        label: Services / Υπηρεσίες
        component: card
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title.en}'

  - name: contact
    label: Contact text / Κείμενο επικοινωνίας
    type: file
    path: src/content/contact.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: intro
        label: Introduction / Εισαγωγή
        component: longCopy

  - name: pressKit
    label: Press kit / Υλικό για ΜΜΕ
    type: file
    path: src/content/press-kit.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: intro
        label: Introduction / Εισαγωγή
        component: longCopy
      - name: downloadUrl
        label: Download URL / Σύνδεσμος λήψης
        type: string
        description: HTTPS URL or a path starting with /; leave blank to hide the button.
      - name: downloadLabel
        label: Button text / Κείμενο κουμπιού
        component: shortCopy
