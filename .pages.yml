# Pages CMS configuration for the independent publication.
# Editorial content and media are editable here; technical settings remain code-reviewed.

media:
  input: public/uploads
  output: /uploads
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif]

settings:
  hide: true
  content:
    merge: true

components:
  shortCopy:
    type: object
    fields:
      - name: en
        label: English
        type: string
      - name: el
        label: Ελληνικά
        type: string

  titleCopy:
    type: object
    required: true
    fields:
      - name: en
        label: English
        type: string
        required: true
      - name: el
        label: Ελληνικά
        type: string
        required: true

  longCopy:
    type: object
    fields:
      - name: en
        label: English
        type: text
      - name: el
        label: Ελληνικά
        type: text

  requiredLongCopy:
    type: object
    required: true
    fields:
      - name: en
        label: English
        type: text
        required: true
      - name: el
        label: Ελληνικά
        type: text
        required: true

content:
  - name: publication
    label: Publication / Ταυτότητα
    type: file
    path: src/content/publication.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: identity
        label: Identity / Ταυτότητα
        type: object
        fields:
          - name: name
            label: Working publication name / Προσωρινό όνομα
            type: string
            required: true
          - name: tagline
            label: Tagline
            component: longCopy
      - name: intro
        label: Homepage introduction / Εισαγωγή αρχικής
        component: longCopy

  - name: articles
    label: Articles / Άρθρα
    type: collection
    path: src/content/articles
    format: json
    filename:
      template: "{slug}.json"
      field: false
    view:
      primary: slug
      fields: [slug, status, date, type, author, topicSlug]
      sort: [date, status, type]
      search: [slug, title.en, title.el, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: slug
        label: Slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use lowercase Latin letters, digits and hyphens only."
        description: Keep this stable after publication; it becomes part of the article URL.
      - name: type
        label: Format / Τύπος
        type: select
        required: true
        options:
          values:
            - { name: feature, label: Feature }
            - { name: profile, label: Profile }
            - { name: essay, label: Essay }
            - { name: interview, label: Interview }
            - { name: review, label: Review }
            - { name: update, label: Short update }
      - name: status
        label: Status / Κατάσταση
        type: select
        required: true
        default: draft
        options:
          values:
            - { name: draft, label: Draft / Προσχέδιο }
            - { name: published, label: Published / Δημοσιευμένο }
      - name: featured
        label: Featured on homepage / Κεντρικό στην αρχική
        type: boolean
        default: false
        description: Only one article may be featured. The build rejects multiple featured stories.
      - name: date
        label: Publication date / Ημερομηνία
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: author
        label: Author / Συντάκτης
        type: reference
        required: true
        options:
          collection: authors
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: topicSlug
        label: Topic / Θεματική
        type: reference
        required: true
        options:
          collection: topics
          search: "label.en,label.el,slug"
          value: "{fields.slug}"
          label: "{fields.label.en}"
      - name: tags
        label: Tags / Ετικέτες
        type: string
        list: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use lowercase Latin letters, digits and hyphens only."
        description: Reuse existing tags when possible, e.g. music, live-music, web.
      - name: title
        label: Title / Τίτλος
        component: titleCopy
      - name: dek
        label: Summary / Υπότιτλος
        component: requiredLongCopy
      - name: image
        label: Hero image / Κεντρική εικόνα
        type: image
      - name: imageAlt
        label: Image description / Περιγραφή εικόνας
        component: shortCopy
        description: Required in both languages when a hero image is used; the build validates this.
      - name: sections
        label: Article sections / Ενότητες άρθρου
        type: block
        list: true
        blockKey: type
        description: Build the article from paragraphs, subheadings and quotes. Drafts may be incomplete; published articles must contain content.
        blocks:
          - name: paragraph
            label: Paragraph / Παράγραφος
            fields:
              - name: text
                label: Text / Κείμενο
                component: requiredLongCopy
          - name: heading
            label: Subheading / Υπότιτλος ενότητας
            fields:
              - name: text
                label: Heading / Υπότιτλος
                component: requiredLongCopy
          - name: quote
            label: Quote / Απόσπασμα
            fields:
              - name: text
                label: Quote / Απόσπασμα
                component: requiredLongCopy
              - name: attribution
                label: Attribution / Απόδοση
                component: shortCopy

  - name: authors
    label: Authors / Συντάκτες
    type: collection
    path: src/content/authors
    format: json
    filename:
      template: "{slug}.json"
      field: false
    view:
      primary: name
      fields: [name, slug]
      sort: [name]
      search: [name, slug]
    fields:
      - name: slug
        label: Author slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use lowercase Latin letters, digits and hyphens only."
      - name: name
        label: Public name / Δημόσιο όνομα
        type: string
        required: true
      - name: role
        label: Role / Ρόλος
        component: shortCopy
      - name: bio
        label: Bio
        component: longCopy
      - name: links
        label: Public links / Δημόσιοι σύνδεσμοι
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: HTTPS URL
            type: string
            pattern:
              regex: "^https://.+$"
              message: "Use a full HTTPS URL."

  - name: topics
    label: Topics / Θεματικές
    type: collection
    path: src/content/topics
    format: json
    filename:
      template: "{slug}.json"
      field: false
    view:
      primary: slug
      fields: [slug, label.en, label.el]
      sort: [slug]
      search: [slug, label.en, label.el]
    fields:
      - name: slug
        label: Topic slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use lowercase Latin letters, digits and hyphens only."
      - name: label
        label: Label / Ονομασία
        component: titleCopy
